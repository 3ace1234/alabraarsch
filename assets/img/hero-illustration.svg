<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-label="Illustration of the Al-Falaah school campus">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2d2"/>
      <stop offset="1" stop-color="#f6fbf0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cce54"/>
      <stop offset="1" stop-color="#5aa72a"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed363"/>
      <stop offset="1" stop-color="#58932b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6cf6d"/>
      <stop offset="1" stop-color="#e09e19"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f4b53a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="548" cy="86" r="40" fill="url(#sun)"/>
  <circle cx="548" cy="86" r="52" fill="none" stroke="#f4b53a" stroke-opacity=".35" stroke-width="4"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="130" cy="70" rx="46" ry="18"/>
    <ellipse cx="100" cy="82" rx="28" ry="14"/>
    <ellipse cx="162" cy="82" rx="30" ry="14"/>
    <ellipse cx="400" cy="120" rx="40" ry="15"/>
    <ellipse cx="372" cy="132" rx="24" ry="12"/>
    <ellipse cx="430" cy="132" rx="26" ry="12"/>
  </g>

  <!-- Distant hills -->
  <ellipse cx="120" cy="330" rx="220" ry="90" fill="#c9e6a4" opacity=".6"/>
  <ellipse cx="540" cy="340" rx="240" ry="100" fill="#bcdd94" opacity=".55"/>

  <!-- Lawn -->
  <ellipse cx="320" cy="468" rx="420" ry="80" fill="#8cce54" opacity=".35"/>
  <path d="M0 440 Q160 416 320 428 Q480 440 640 424 L640 500 L0 500 Z" fill="#aed47c"/>
  <path d="M0 458 Q180 442 340 452 Q510 462 640 450 L640 500 L0 500 Z" fill="#92c65c"/>

  <!-- Rear building (block B) -->
  <g>
    <rect x="386" y="180" width="150" height="168" rx="6" fill="#e9f3dd"/>
    <rect x="386" y="180" width="150" height="168" rx="6" fill="none" stroke="#cfe3ba" stroke-width="3"/>
    <rect x="398" y="196" width="42" height="42" rx="4" fill="#cfe9b2"/>
    <rect x="456" y="196" width="42" height="42" rx="4" fill="#cfe9b2"/>
    <rect x="398" y="250" width="42" height="42" rx="4" fill="#cfe9b2"/>
    <rect x="456" y="250" width="42" height="42" rx="4" fill="#cfe9b2"/>
    <rect x="398" y="304" width="100" height="32" rx="6" fill="#b8d998"/>
    <rect x="398" y="304" width="34" height="32" rx="6" fill="#c9e5a8"/>
  </g>

  <!-- Main school building -->
  <g>
    <!-- Roof -->
    <path d="M96 190 L320 96 L544 190 Z" fill="url(#roof)"/>
    <path d="M96 190 L320 96 L544 190 Z" fill="none" stroke="#4b8a24" stroke-width="4" stroke-linejoin="round"/>
    <rect x="270" y="112" width="100" height="26" rx="4" fill="#d9edbf"/>
    <text x="320" y="130" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" font-weight="bold" fill="#3c7220" letter-spacing="2">AL-FALAAH</text>

    <!-- Block A -->
    <rect x="118" y="190" width="160" height="246" rx="6" fill="#f7fbf0"/>
    <rect x="118" y="190" width="160" height="246" rx="6" fill="none" stroke="#d5e8c0" stroke-width="3"/>
    <rect x="118" y="356" width="160" height="80" rx="6" fill="#fbf9ec"/>
    <rect x="118" y="356" width="160" height="80" rx="6" fill="none" stroke="#d5e8c0" stroke-width="3"/>

    <!-- Block B -->
    <rect x="300" y="190" width="78" height="246" rx="6" fill="#f3f9ea"/>
    <rect x="300" y="190" width="78" height="246" rx="6" fill="none" stroke="#d5e8c0" stroke-width="3"/>
    <rect x="316" y="212" width="46" height="46" rx="5" fill="#cfe9b2"/>
    <rect x="316" y="272" width="46" height="46" rx="5" fill="#cfe9b2"/>
    <rect x="316" y="332" width="46" height="46" rx="5" fill="#cfe9b2"/>

    <!-- Windows A -->
    <g fill="#bfe39a" stroke="#a5cd7c" stroke-width="2">
      <rect x="136" y="208" width="46" height="46" rx="5"/>
      <rect x="196" y="208" width="46" height="46" rx="5"/>
      <rect x="136" y="272" width="46" height="46" rx="5"/>
      <rect x="196" y="272" width="46" height="46" rx="5"/>
      <rect x="136" y="296" width="46" height="30" rx="4" fill="#a9d477" stroke="#87b85c" stroke-width="2"/>
      <rect x="196" y="296" width="46" height="30" rx="4" fill="#a9d477" stroke="#87b85c" stroke-width="2"/>
    </g>
    <path d="M159 208 v46 M182 208 v46 M219 208 v46 M242 208 v46" stroke="#d8eec4" stroke-width="2"/>

    <!-- Clock -->
    <circle cx="339" cy="160" r="17" fill="#fff" stroke="#caa234" stroke-width="4"/>
    <path d="M339 152 v9 l7 5" stroke="#5a6b50" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- Pillars/entrance -->
    <rect x="256" y="300" width="22" height="126" rx="4" fill="#dceccb"/>
    <rect x="278" y="300" width="22" height="126" rx="4" fill="#dceccb"/>
    <path d="M140 348 h112 l0 8 q-28 14 -56 0 Z" fill="#8cce54"/>
    <rect x="150" y="356" width="92" height="56" rx="10" fill="#cfdf9e"/>
    <rect x="150" y="356" width="92" height="56" rx="10" fill="none" stroke="#b8cb7d" stroke-width="3"/>
    <circle cx="158" cy="384" r="3" fill="#8a9b5e"/>
    <rect x="166" y="366" width="64" height="36" rx="6" fill="#8cce54" opacity=".85"/>
    <rect x="166" y="366" width="64" height="36" rx="6" fill="none" stroke="#5aa72a" stroke-width="2.5"/>

    <!-- Flag -->
    <line x1="300" y1="96" x2="300" y2="44" stroke="#3c7220" stroke-width="4" stroke-linecap="round"/>
    <path d="M300 46 q34 6 34 24 q0 6 -34 10 Z" fill="#e09e19"/>
  </g>

  <!-- Trees -->
  <g>
    <rect x="52" y="330" width="12" height="78" rx="5" fill="#8a6a3f"/>
    <circle cx="58" cy="312" r="34" fill="url(#tree)"/>
    <circle cx="58" cy="300" r="26" fill="#a9d477"/>
    <rect x="86" y="346" width="10" height="62" rx="4" fill="#7c5e37"/>
    <circle cx="91" cy="330" r="26" fill="url(#tree)"/>
    <circle cx="91" cy="320" r="19" fill="#a9d477"/>
  </g>

  <!-- Children -->
  <g>
    <!-- Child A -->
    <g>
      <circle cx="196" cy="418" r="13" fill="#e3a76f"/>
      <path d="M184 418 q-4 -2 -3 -6 q6 2 15 0 q3 3 0 8 Z" fill="#e3a76f"/>
      <rect x="178" y="430" width="36" height="30" rx="9" fill="#5aa72a"/>
      <rect x="178" y="430" width="36" height="30" rx="9" fill="none" stroke="#377d13" stroke-width="2.5"/>
      <path d="M174 440 q4 10 22 10 t22 -10 l-4 34 h-36 Z" fill="#3f7222"/>
      <line x1="188" y1="432" x2="188" y2="412" stroke="#3f7222" stroke-width="6" stroke-linecap="round"/>
      <line x1="204" y1="432" x2="204" y2="412" stroke="#3f7222" stroke-width="6" stroke-linecap="round"/>
      <rect x="196" y="466" width="24" height="26" rx="5" fill="#2d5b1c"/>
      <circle cx="207" cy="492" r="5" fill="#233f16"/>
    </g>

    <!-- Child B -->
    <g>
      <circle cx="316" cy="418" r="13" fill="#8a5f3c"/>
      <path d="M304 418 q-4 -2 -3 -6 q6 2 15 0 q3 3 0 8 Z" fill="#8a5f3c"/>
      <rect x="298" y="429" width="36" height="30" rx="9" fill="#e09e19"/>
      <rect x="298" y="429" width="36" height="30" rx="9" fill="none" stroke="#bb7f0c" stroke-width="2.5"/>
      <path d="M294 440 q4 10 22 10 t22 -10 l-4 34 h-36 Z" fill="#c28212"/>
      <line x1="308" y1="431" x2="308" y2="412" stroke="#8a5f3c" stroke-width="6" stroke-linecap="round"/>
      <line x1="324" y1="431" x2="324" y2="412" stroke="#8a5f3c" stroke-width="6" stroke-linecap="round"/>
      <rect x="308" y="466" width="22" height="24" rx="11" fill="#2d5b1c"/>
      <circle cx="318" cy="491" r="5" fill="#233f16"/>
    </g>

    <!-- Child C -->
    <g>
      <circle cx="428" cy="428" r="12" fill="#b87a45"/>
      <rect x="412" y="438" width="34" height="26" rx="8" fill="#4e9c2c"/>
      <rect x="412" y="438" width="34" height="26" rx="8" fill="none" stroke="#2f7a16" stroke-width="2.5"/>
      <path d="M408 447 q4 9 21 9 t21 -9 l-3 31 h-36 Z" fill="#1f4d12"/>
      <line x1="422" y1="440" x2="422" y2="424" stroke="#b87a45" stroke-width="5" stroke-linecap="round"/>
      <line x1="436" y1="440" x2="436" y2="424" stroke="#b87a45" stroke-width="5" stroke-linecap="round"/>
      <rect x="424" y="472" width="20" height="24" rx="10" fill="#2d5b1c"/>
    </g>
  </g>

  <!-- Front book bases / steps -->
  <g fill="#eef6e7" stroke="#d5e8c0" stroke-width="2">
    <rect x="150" y="424" width="120" height="14" rx="5"/>
    <rect x="160" y="412" width="100" height="12" rx="5"/>
  </g>
</svg>