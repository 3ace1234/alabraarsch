    <rect x="398" y="218" width="44" height="62" rx="14" fill="none" stroke="#377d1c" stroke-width="3"/>
    <rect x="412" y="250" width="16" height="40" rx="6" fill="#e09e19"/>
    <path d="M392 292 q2 20 10 26 l-8 14 q-10 -2 -14 -20 Z" fill="#2d5b1c"/>
    <path d="M448 292 q-2 20 -10 26 l8 14 q10 -2 14 -20 Z" fill="#1c3f12"/>
    <line x1="404" y1="240" x2="360" y2="286" stroke="#e3a76f" stroke-width="5" stroke-linecap="round"/>
    <line x1="438" y1="240" x2="398" y2="262" stroke="#e3a76f" stroke-width="5" stroke-linecap="round"/>
    <path d="M356 246 l28 -8" stroke="#4b8a24" stroke-width="5" stroke-linecap="round"/>
    <rect x="348" y="224" width="10" height="34" rx="5" fill="#75450d"/>
    <path d="M344 224 l28 6 q4 6 0 8 l-28 6 q-6 -2 -2 -10 Z" fill="#e09e19"/>
