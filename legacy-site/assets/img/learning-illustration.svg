  <path d="M130 330 L470 330 L452 388 Q300 412 148 388 Z" fill="#dceccb" stroke="#bfe39a" stroke-width="3"/>
  <rect x="150" y="330" width="300" height="14" rx="7" fill="#eef6e7"/>

  <!-- Laptop base -->
  <path d="M228 300 L332 300 L354 344 Q300 354 206 344 Z" fill="#2d5b1c"/>
  <path d="M206 344 Q300 354 354 344 L348 352 Q300 362 212 352 Z" fill="#1c3f12"/>

  <!-- Laptop screen -->
  <rect x="196" y="144" width="168" height="156" rx="10" fill="url(#scr)"/>
  <rect x="182" y="138" width="196" height="14" rx="7" fill="#377d1c"/>

  <!-- Screen content -->
  <g>
    <rect x="210" y="170" width="60" height="16" rx="8" fill="#a9d477"/>
    <rect x="210" y="194" width="40" height="16" rx="8" fill="#e09e19"/>
    <rect x="210" y="218" width="52" height="16" rx="8" fill="#7cc143"/>
