    <text x="210" y="268" font-family="Verdana, sans-serif" font-size="11" font-weight="bold" fill="#cfe3b0" letter-spacing="1">AL-FALAAH</text>
    <circle cx="344" cy="262" r="6" fill="#e09e19"/>
  </g>

  <!-- Child (left) -->
