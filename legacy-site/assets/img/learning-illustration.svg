<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-label="Illustration of a digital literacy class">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f5dc"/>
      <stop offset="1" stop-color="#f8fcf3"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6b2b"/>
      <stop offset="1" stop-color="#27501a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6cf6d"/>
      <stop offset="1" stop-color="#e09e19"/>
    </linearGradient>
  </defs>

  <rect width="560" height="460" fill="url(#bg)"/>
  <circle cx="470" cy="70" r="70" fill="#abdd88" opacity=".5"/>
  <circle cx="90" cy="400" r="110" fill="#ccebb5" opacity=".5"/>

  <!-- Floating symbols -->
  <g fill="none" stroke="#5aa72a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 96 l10 -10 10 10 10 -10 10 10"/>
    <circle cx="42" cy="88" r="9" fill="#e09e19" stroke="none"/>
    <path d="M15 140 h38"/>
    <path d="M22 150 h24"/>
    <path d="M492 132 l12 -8 l12 8 l-12 22 Z" fill="#a9d477" stroke="none"/>
    <path d="M498 150 l3 14 l-3 6" stroke="#4b8a24"/>
